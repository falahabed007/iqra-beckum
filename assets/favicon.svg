<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Iqraa-Schule Beckum">
  <!-- Aufgegriffen vom Vereinslogo: der goldene Kreis ueber dem
       aufgeschlagenen Buch. Bewusst ohne Kalligrafie, weil Schrift in
       einem 16 Pixel grossen Favicon nicht lesbar waere. -->
  <defs>
    <radialGradient id="sonne" cx="42%" cy="34%" r="72%">
      <stop offset="0%"   stop-color="#FFE9A3"/>
      <stop offset="55%"  stop-color="#FFCC3D"/>
      <stop offset="100%" stop-color="#EE9E0C"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="#FBF7EF"/>
  <circle cx="32" cy="27" r="18" fill="url(#sonne)"/>

  <g stroke="#8A5A12" stroke-width="2" stroke-linejoin="round" fill="#F5B62A">
    <path d="M4 43c8-4 19-4 27 2v13C23 52 12 52 4 56z"/>
    <path d="M60 43c-8-4-19-4-27 2v13c8-6 19-6 27-2z"/>
  </g>
  <path d="M32 45v13" stroke="#8A5A12" stroke-width="2" stroke-linecap="round"/>
</svg>
